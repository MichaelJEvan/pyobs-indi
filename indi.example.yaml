# Runs IndiTelescope against indiserver in the OrbStack ubuntu machine.
# Copy to indi-test.yaml and fill in the password; the real file is gitignored.
#
#   cp indi.example.yaml indi.yaml   (indi.yaml is gitignored)
#   PYTHONPATH=. pyobs indi.yaml

class: pyobs_indi.IndiTelescope
host: ubuntu.orb.local
device: Telescope Simulator
port: 7624
# auto_flip: true          # meridian flip is automatic; false to disable

comm:
  class: pyobs.comm.xmpp.XmppComm
  jid: indi@localhost
  server: localhost:5222
  password: <password>

timezone: utc
location:                 # 0/0/0 is fine here -- only alt/az depends on it
  longitude: 0.0
  latitude: 0.0
  elevation: 0.0
